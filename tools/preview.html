<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-kujira 预览</title>
<link rel="icon" href="data:,">
<style>
    html, body
    {
        margin: 0;
        height: 100%;
        background: #14141A;
        color: #E8E8EC;
        font: 13px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
    }

    #hud
    {
        position: fixed;
        left: 16px;
        top: 14px;
        max-width: 330px;
        z-index: 20;
    }

    #hud h1
    {
        margin: 0 0 5px;
        font-size: 14px;
        font-weight: 500;
    }

    #hud p
    {
        margin: 0 0 7px;
        font-size: 12px;
        color: #7C7C88;
        line-height: 1.65;
    }

    #hud code
    {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: #9FD0FF;
        background: rgba(80, 140, 220, .12);
        border-radius: 4px;
        padding: 1px 5px;
    }

    #status
    {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: #6FBF9A;
        white-space: pre-line;
    }

    #status.err
    {
        color: #F09595;
    }

    /* 状态模拟条 */
    #sim
    {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 20;
        max-width: 470px;
    }

    #sim .lbl
    {
        font-size: 11px;
        color: #6E6E7A;
        margin-bottom: 6px;
        font-family: ui-monospace, Menlo, monospace;
    }

    #sim .row
    {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    #sim button
    {
        border: 1px solid #38383F;
        background: #22222A;
        color: #C8C8D4;
        border-radius: 7px;
        padding: 4px 11px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
    }

    #sim button:hover
    {
        border-color: #6FA8DC;
        color: #EAF2FF;
    }

    #sim button.warn:hover
    {
        border-color: #EF9F27;
        color: #FFD79A;
    }

    #sim .note
    {
        margin-top: 7px;
        font-size: 11.5px;
        color: #5E5E6A;
        line-height: 1.6;
    }

    #frame
    {
        position: fixed;
        inset: 0;
        pointer-events: none;
        border: 1px dashed rgba(120, 160, 220, .16);
        z-index: 80;
    }

    /* 窄视口（DSH 侧边预览面板基本都在这个区间）。
       左下角这排调试按钮会盖住宠物本体，而这页的重点本来就是看宠物 ——
       所以窄屏下让调试区缩到最小、说明文字直接收起，把舞台让出来。 */
    @media (max-width: 620px)
    {
        #sim
        {
            left: 8px;
            bottom: 8px;
            max-width: calc(100vw - 16px);
        }

        #sim .lbl,
        #sim .note
        {
            display: none;
        }

        #sim .row
        {
            gap: 4px;
        }

        #sim button
        {
            padding: 3px 8px;
            font-size: 11px;
        }

        header
        {
            padding: 10px 12px;
        }

        header p
        {
            font-size: 10.5px;
        }
    }

    #sim {top:14px;right:16px;left:auto;bottom:auto;max-width:390px}
    /* DSH InputBar.tsx / InputBar.module.css, c291e796: native composer fixture. */
    #preview-composer {--dsw-specific-input-major:#2b2b2d;--dsw-alias-label-secondary:#d1d1d4;--dsw-alias-label-caption:#858589;--dsw-specific-selector:#333335;--dsw-alias-button-info-fill:#669dff;--dsw-alias-button-info-hover:#7dabff;position:fixed;left:24px;bottom:58px;width:min(1500px,calc(100vw - 48px));box-sizing:border-box;border:0;border-radius:22px;padding-top:8px;background:var(--dsw-specific-input-major);color:var(--dsw-alias-label-secondary);font-size:14px;line-height:24px;display:flex;flex-direction:column;gap:12px;z-index:10}
    #preview-composer[data-theme="light"] {--dsw-specific-input-major:#f5f5f5;--dsw-alias-label-secondary:#52545a;--dsw-alias-label-caption:#858589;--dsw-specific-selector:#ebebed;--dsw-alias-button-info-fill:#4d6bfe;--dsw-alias-button-info-hover:#3b5ae8}
    .preview-input {box-sizing:border-box;min-height:36px;padding:4px 8px 0 14px;color:var(--dsw-alias-label-caption)}
    .preview-toolbar {display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-width:0;padding:2px 8px 6px}
    .preview-tools,.preview-trailing {display:flex;align-items:center;gap:12px;min-width:0}
    .preview-trailing {flex:none;margin-left:auto}
    .preview-add {display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:999px;background:var(--dsw-specific-selector)}
    .preview-permission,.preview-model {display:flex;align-items:center;gap:4px;font-size:13px;line-height:20px;white-space:nowrap}
    #preview-pause-slot:empty {display:none}
    #preview-stop {display:grid;place-items:center;flex:none;width:34px;height:34px;border:none;border-radius:999px;corner-shape:round;background:var(--dsw-alias-button-info-fill);color:#fff;cursor:pointer;transition:background-color 100ms ease;transform:translateY(-2px)}
    #preview-stop:hover:not(:disabled) {background:var(--dsw-alias-button-info-hover)}
    #preview-stop:disabled {opacity:.4;cursor:default}
    @media(max-width:700px){#hud{display:none}#sim{left:12px;right:12px;max-width:none}#sim .note{display:none}}

    #hud summary {color:#9da2ae;font-size:11px;cursor:pointer;margin-top:6px}
    #preview-debug[open] {background:#202228;padding:10px;border:1px solid #353840;border-radius:8px}
    #sim {padding:12px 14px;background:#202228;border:1px solid #353840;border-radius:12px;box-sizing:border-box}
    #sim button {font-size:11px;padding:5px 9px}
    #sim .row {gap:5px;margin-top:8px}
    #usage-mode {font-size:10px;color:#9da2ae}
</style>
</head>
<body data-ds-dark-theme>
<script>
const galleryOptions = new URLSearchParams(location.search);
const galleryMode = galleryOptions.has('gallery');
if (galleryMode) {
  document.documentElement.dataset.gallery = 'true';
  const locale = galleryOptions.get('lang') === 'en' ? 'en-US' : 'zh-CN';
  document.documentElement.lang = locale;
  localStorage.setItem('dsh-kujira:settings', JSON.stringify({appearance:{locale,theme:'dark',size:260,usage:false,execution:galleryOptions.get('gallery')==='task',care:false,playful:false}}));
  localStorage.setItem('dsh-kujira:position', JSON.stringify({x:Math.round(innerWidth / 2 + 95),y:Math.round(innerHeight / 2 - 70)}));
}
</script>
<style>
html[data-gallery] body {background:#181a1f}
html[data-gallery] :is(#frame,#hud,#sim,#preview-composer) {display:none}
html[data-gallery] .dsh-kujira-root:has(.dsh-kujira-panel) .dsh-kujira-orb {visibility:hidden}
</style>

<div id="hud">
    <h1>鲸鱼娘 · 本地预览</h1>
    <details id="preview-debug"><summary>运行信息</summary><div id="status">正在加载…</div></details>
</div>

<div id="sim">
    <div class="lbl">状态预览</div>
    <div class="row">
        <button data-k="thinking">思考</button>
        <button data-k="working">工作中</button>
        <button data-k="result">整理</button><button data-k="retry">重试</button>
        <button data-k="waiting">等你确认</button>
        <button data-k="ask">模型提问</button>
        <button data-k="success">完成</button>
        <button data-k="error">出错</button>
        <button class="warn" data-k="abort">中断回合</button>
        <button class="warn" data-k="idle">清空（回空闲）</button>
        <button id="demo-rewards">模拟新会话与补给</button><button id="demo-energy">补给能量 +0.02</button>
        <button data-k="extreme">长内容与多任务</button>
        <button data-k="cross-turn">跨轮次与 PTC</button>

    </div>
    <div class="row" aria-label="费用模拟数据"><span>费用示例：</span><button data-usage="offpeak">模拟谷价</button><button data-usage="peak">模拟峰价</button><button data-usage="empty">暂无用量</button><button id="demo-cost">费用 +0.04</button><span id="usage-mode">点击切换示例</span></div>

</div>

<div id="preview-composer" data-composer-card>
  <div class="preview-input">发消息或创建任务，/ 调用指令，@ 文件或对话</div>
  <div class="preview-toolbar">
    <div class="preview-tools" aria-hidden="true">
      <span class="preview-add"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
      <span class="preview-add"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 5v5a2 2 0 0 0 4 0V4a3 3 0 0 0-6 0v6a4 4 0 0 0 8 0V5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
      <span class="preview-permission"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5 13 4v4c0 3-5 6-5 6s-5-3-5-6V4zM8 5v4m0 1v1" stroke="currentColor" stroke-width="1.2"/></svg>完全权限<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-linecap="round"/></svg></span>
    </div>
    <div class="preview-trailing">
      <span id="preview-pause-slot"></span>
      <span class="preview-model">deepseek-flash Max<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-linecap="round"/></svg></span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="2" opacity=".3"/><path d="M8 3a5 5 0 0 1 5 5" stroke="currentColor" stroke-width="2"/></svg>
      <button type="button" aria-label="停止预览任务" id="preview-stop"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="3" fill="currentColor" /></svg></button>
    </div>
  </div>
</div>
<script>document.getElementById('preview-composer').dataset.theme = galleryOptions.get('composerTheme') === 'light' ? 'light' : 'dark';</script>
<!-- 真 React（DSH 外壳在真实环境里提供的也是这个） -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script>
/* ============================================================================
 *  预览宿主（harness）
 *  ---------------------------------------------------------------------------
 *  真实 DSH 环境里，外壳会预先注入 window.__ModuleLoader__，并提供
 *  require('react') 等模块。这里把这两件事补上，让未经改动的 lib/client.js
 *  原样跑起来 —— 预览里能跑，装进 DSH 里就能跑。
 *
 *  唯一被"假"掉的是 ctx.slots（真实规则是 inject + yield register）和
 *  ctx.on / ctx.credentials（由 tools/preview-server.mjs 提供）。
 * ========================================================================= */

(function ()
{
    const statusEl = document.getElementById('status');
    const root = document.createElement('div');
    root.id = 'preview-pet-root';
    document.body.appendChild(root);

    function setStatus(text, isError)
    {
        statusEl.textContent = text;
        statusEl.className = isError ? 'err' : '';
    }

    function fakeRequire(name)
    {
        if (name === 'react')
        {
            return window.React;
        }
        if (name === 'react/jsx-runtime')
        {
            return {
                jsx: (type, props) => window.React.createElement(type, props),
                jsxs: (type, props) => window.React.createElement(type, props),
                Fragment: window.React.Fragment
            };
        }
        if (name === 'react-dom')
        {
            return window.ReactDOM;
        }
        throw new Error('preview: 没有 stub 的模块 "' + name + '"');
    }

    function makeFakeContext()
    {
        const mounted = [];
        const sessionListeners = new Set(), addresses = new Map();
        let selectedSession = 'preview-session';
        const openSession = id => {selectedSession=id;for(const listener of sessionListeners)listener(id);};
        const previewNavigation = async target => {
                    const dialog=document.createElement('dialog');
                    dialog.style.cssText='max-width:480px;width:calc(100vw - 64px);background:#27292e;color:#e5e7eb;border:1px solid #4c515a;border-radius:14px;padding:20px;font:13px/1.7 system-ui';
                    const title=document.createElement('strong');title.textContent='模拟导航 · '+(target.kind==='child'?'子代理会话':target.kind==='file'?target.path:'对应会话步骤');
                    const content=document.createElement('p');content.style.whiteSpace='pre-wrap';
                    content.textContent=target.kind==='file'?'文件入口已连接。在 DSH 中会打开当前会话的文件预览。':'会话定位入口已连接。在 DSH 中会打开对应的会话内容。';
                    if(target.kind==='child') {const response=await fetch('/dsh-kujira/activity?sessionId='+encodeURIComponent(target.id));const value=await response.json();content.textContent=value.activity?.summary || '子代理正在执行回归验证。';}
                    const close=document.createElement('button');close.textContent='关闭预览';close.onclick=()=>dialog.close();dialog.append(title,content,close);document.body.append(dialog);dialog.addEventListener('close',()=>dialog.remove(),{once:true});dialog.showModal();return true;
                };
        const services = {
            sessions: {
                openSubagent: value => {addresses.set(value.childSessionId,value);openSession(value.childSessionId);},
                open: openSession,
                subagentAddress: id => addresses.get(id),
                list: {getSnapshot:()=>({current:selectedSession})},
                binding: () => ({session:{loadThrough: async seq => {
                    let value=await (await fetch('/dsh-kujira/activity?sessionId=preview-session')).json();
                    let items=value.activity.messages,hasMore=value.activity.hasMoreMessages,before=value.activity.messageBefore;
                    while(hasMore && before>seq){value=await(await fetch('/dsh-kujira/activity?sessionId=preview-session&messagesBefore='+before)).json();items=[...items,...value.items];hasMore=value.hasMore;before=value.before;}
                    document.getElementById('preview-message-log')?.remove();
                    const log=document.createElement('section');log.id='preview-message-log';log.setAttribute('data-chat-flow','');
                    log.style.cssText='position:fixed;left:24px;top:270px;width:min(420px,40vw);height:350px;overflow:auto;padding:12px;background:#202126;border-radius:12px;color:#dedee5;font:13px/1.6 system-ui';
                    for(const item of items.reverse()){const row=document.createElement('p');row.dataset.chatAnchorKey=item.key;row.dataset.chatTurn=item.turn;row.textContent=item.text;log.appendChild(row);}document.body.appendChild(log);
                }}})
            },
            sidebarRight: { openResource: address => previewNavigation({kind:'file',path:decodeURIComponent(address.split('/').slice(5).join('/'))}) }
        };
        return {
            mounted,
            ctx: {
                get: name => services[name],
                slots: {
                    inject(slotName, generatorFactory)
                    {
                        const step = generatorFactory().next();
                        mounted.push({ slotName, element: step.value });
                        const target = document.createElement('div');
                        if (slotName === "conversation.input.right") document.getElementById("preview-pause-slot").appendChild(target);
                        else root.appendChild(target);
                        if (slotName === 'conversation.composer.dock')
                        {
                            target.style.cssText = 'position:fixed;left:24px;width:min(590px,calc(100vw - 48px));bottom:20px;z-index:20';
                            target.setAttribute('aria-label', '会话费用栏预览');
                        }
                        ReactDOM.createRoot(target).render(step.value);
                    },
                    register(meta, Component)
                    {
                        return React.createElement(function PreviewEntry(){
                            const [sessionId,setSessionId]=React.useState(selectedSession);
                            React.useEffect(()=>{sessionListeners.add(setSessionId);return()=>sessionListeners.delete(setSessionId);},[]);
                            return React.createElement(Component,{sessionId:galleryMode && galleryOptions.get('gallery')!=='task'?null:sessionId,useProjection:()=>undefined});
                        });
                    }
                }
            }
        };
    }

    document.getElementById("preview-stop").onclick = () => fetch("/__preview/gate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"cancel"})});
    window.__ModuleLoader__ = {
        load(info)
        {
            try
            {
                const mod = info.factory(fakeRequire);
                const fake = makeFakeContext();
                mod.apply(fake.ctx);

                const slots = fake.mounted.map((m) => m.slotName).join(', ') || '(无)';

                fetch('/__preview/info').then((r) => r.json()).then((m) =>
                {
                    setStatus(
                        '插件 id    : ' + info.id + '\n' +
                        '插件 name  : ' + mod.name + '\n' +
                        'inject     : ' + JSON.stringify(mod.inject) + '\n' +
                        '已挂槽位   : ' + slots + '\n' +
                        'React      : ' + window.React.version + '\n' +
                        '余额可用   : ' + (m.hasApiKey ? '是（密钥来源 ' + m.apiKeySource + '，只在服务端用）' : '否 — 没找到 DEEPSEEK_API_KEY')
                    );
                }).catch(() =>
                {
                    setStatus('插件已加载，但读不到 /__preview/info');
                });
            }
            catch (error)
            {
                setStatus('加载失败：' + (error && error.message ? error.message : error), true);
                console.error('[preview]', error);
            }
        }
    };

    window.addEventListener('error', (e) => setStatus('运行时错误：' + e.message, true));

    document.getElementById('demo-cost').onclick=()=>fetch('/__preview/cost',{method:'POST'});
    document.getElementById('demo-energy').onclick=()=>fetch('/__preview/rewards?step=1',{method:'POST'});
    document.getElementById('demo-rewards').onclick=()=>fetch('/__preview/rewards',{method:'POST'});
    document.querySelectorAll('[data-usage]').forEach(button=>button.onclick=async()=>{
        await fetch('/__preview/usage?mode='+button.dataset.usage,{method:'POST'});
        document.getElementById('usage-mode').textContent='当前：'+button.textContent+'（最多 5 秒更新）';
    });
    // 状态模拟按钮
    document.getElementById('demo-plan').onclick=()=>fetch('/__preview/plan',{method:'POST'});
    document.querySelectorAll('#sim button[data-k]').forEach((btn) =>
    {
        btn.onclick = async () =>
        {
            const kind = btn.dataset.k;
            try
            {
                const out = await fetch('/__preview/emit', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ kind })
                }).then((r) => r.json());
                btn.blur();
                console.log('[preview] emit', kind, out);
            }
            catch (error)
            {
                setStatus('模拟事件失败：' + error.message, true);
            }
        };
    });
})();
</script>

<!-- 未经改动的真实客户端半侧 -->
<script src="/client.js"></script>
